name: astrbot_plugin_think_gate
display_name: 思考 or 不思考
short_desc: 主模型回复前按分数决定是否临时开启深度思考
desc: |
  每次主模型回复前，用可配置的判断模型打 0–100 分，再按「思考浓度」阈值决定是否临时打开同一主模型的深度思考（改 custom_extra_body.thinking，不分叉第二套聊天提供商）。

  默认关闭；开启后同一 Agent 轮只判断一次，工具二跳复用结果；仅在 agent 结束时恢复基线。
version: 0.1.0
author: Yucheng-Z
repo: https://github.com/Yucheng-Z/astrbot_plugin_think_gate
tags:
